<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lapan Malaysia</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="/style.css"></head>
<body><header><strong>🇲🇾 Lapan Malaysia</strong><span>Driving routes · Traffic · Rail stops</span></header><main><section class="panel"><h1>Explore Malaysia</h1><p>Tap the map to choose your start, then your destination.</p><div class="actions"><button id="reset">Reset</button><button id="route">Driving route</button></div><div class="actions"><button id="traffic">Traffic incidents</button><button id="rail">Rail stops</button></div><label>Rail feed <select id="feed"><option value="rapid">Rapid Rail KL</option><option value="ktmb">KTMB</option></select></label><label><input type="checkbox" id="voice" checked> Speak route summary in English</label><p id="status" role="status" aria-live="polite">Choose two points on the map.</p><div id="results"></div><p class="note">Prototype only. Follow road signs and drive safely. Traffic and rail data may be delayed or incomplete.</p></section><div id="map" aria-label="Interactive Malaysia map"></div></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="/app.js" defer></script></body></html>
